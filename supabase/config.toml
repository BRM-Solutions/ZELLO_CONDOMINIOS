# Config do Supabase CLI (uso local e `supabase link`). Referencia: https://supabase.com/docs/guides/local-development/cli/config
project_id = "{{SLUG}}"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

# Seed roda so em `supabase db reset` local. `db push` nunca semeia dev/prod.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
