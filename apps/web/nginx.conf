# __API_URL__ e __SUPABASE_URL__ sao substituidos no build (Dockerfile) pelos valores de VITE_API_URL e VITE_SUPABASE_URL.
# Hash do script inline de tema (index.html) em script-src; mudou o script, recalcule (teste csp.test.ts avisa).
# style-src com 'unsafe-inline' so por causa do sonner, que injeta <style> em runtime; remova se trocar a lib.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FhXSNwzmpcA+n8B3hIEm0bUPttnL7Za8uPPMHpukSeM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __SUPABASE_URL__; font-src 'self' data:; connect-src 'self' __API_URL__ __SUPABASE_URL__; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  location = /index.html {
    expires -1;
  }

  location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
